<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
		/>
		<title>modus</title>
		<meta
			name="description"
			content="Play a few notes on your guitar and see which keys, scales and modes they belong to, right on the fretboard."
		/>
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1815" media="(prefers-color-scheme: dark)" />

		<!-- Link previews. %SITE_URL% is filled in at build time (see vite.config.ts). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="modus" />
		<meta property="og:title" content="modus" />
		<meta
			property="og:description"
			content="Play a few notes. Find the scales they belong to."
		/>
		<meta property="og:image" content="%SITE_URL%/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="The modus wordmark above a guitar fretboard showing C major."
		/>
		<meta name="twitter:card" content="summary_large_image" />

		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
